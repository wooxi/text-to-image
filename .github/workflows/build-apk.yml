name: Build Android APK

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" --channel=3 2>&1 || sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>&1
      - name: Install deps
        run: npm ci
      - name: Create data dir and init DB
        run: mkdir -p data && npx drizzle-kit push --force
      - name: Build Next.js
        run: npm run build
      - name: Build Capacitor web shell
        run: npm run build:capacitor-web
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
