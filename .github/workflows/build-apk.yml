name: Build Android APK

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true
      - name: Setup Android SDK (retry)
        if: failure()
        uses: android-actions/setup-android@v3
      - name: Generate keystore (first time) or restore from cache
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: android/app/release.keystore
          key: release-keystore-v1
      - name: Create keystore if not cached
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v -keystore android/app/release.keystore -alias texttoimage \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass android123 -keypass android123 \
            -dname "CN=TextToImage, OU=Dev, O=TextToImage, L=SZ, ST=GD, C=CN"
      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" --channel=3 2>&1 || sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>&1
      - name: Install deps
        run: npm ci
      - name: Create data dir and init DB
        run: mkdir -p data && npx drizzle-kit push --force
      - name: Build Next.js
        run: npm run build
      - name: Build Capacitor web shell
        run: npm run build:capacitor-web
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Set version from git tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          if [ "$TAG" != "$GITHUB_REF" ] && [ -n "$TAG" ]; then
            echo "Tag push detected, setting version to $TAG"
            sed -i "s/versionName \".*\"/versionName \"$TAG\"/" android/app/build.gradle
          fi
      - name: Build APK
        id: build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          # Rename APK with version name
          VERSION=$(grep versionName app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          mv "$APK" "app/build/outputs/apk/debug/ai-wenshengtu-v${VERSION}.apk"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK Build
          body: |
            版本: v${{ steps.build.outputs.version }}
            构建时间: ${{ github.event.head_commit.timestamp }}
          files: android/app/build/outputs/apk/debug/ai-wenshengtu-v*.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove old release assets
        run: |
          RELEASE=$(curl -sH "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest")
          RELEASE_ID=$(echo "$RELEASE" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "$RELEASE" | python3 -c "
          import json, sys, urllib.request
          data = json.load(sys.stdin)
          current = 'ai-wenshengtu-v\${{ steps.build.outputs.version }}.apk'
          for a in data.get('assets',[]):
              if a['name'] != current:
                  req = urllib.request.Request(a['url'], method='DELETE')
                  req.add_header('Authorization', 'Bearer \${{ secrets.GITHUB_TOKEN }}')
                  urllib.request.urlopen(req)
                  print('removed:', a['name'])
          "
